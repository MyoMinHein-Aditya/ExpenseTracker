<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PaisaTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg:#fff2e4; --surface:#ffe3c2; --border:#c98b47;
    --border-bright:#6a00f4; --text:#2f1b0c; --muted:#7a4a1d;
    --accent:#ffd6a5; --accent-dim:#ffd6a533;
    --apricot:#6a00f4; --apricot-dim:#6a00f426;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:linear-gradient(135deg, #fff2e4 0%, #ffd9b2 100%);color:var(--text);font-family:'Baloo 2',cursive;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card {background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border-bright); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(106,0,244,0.1);}
  .logo{font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--accent);margin-bottom: 24px;}
  .logo span{color:var(--apricot);}
  
  .tabs {display: flex; margin-bottom: 24px; border-radius: 12px; background: var(--bg); overflow: hidden; border: 1px solid var(--border);}
  .tab {flex: 1; padding: 12px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all .2s;}
  .tab.active {background: var(--apricot-dim); color: var(--apricot);}
  
  .input-group {margin-bottom: 16px; text-align: left;}
  .input-group label {display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'Space Mono', monospace; margin-bottom: 6px;}
  .input-group input {width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: 'Baloo 2', cursive; font-size: 16px;}
  .input-group input:focus {outline: none; border-color: var(--apricot); box-shadow: 0 0 0 3px var(--apricot-dim);}
  
  .btn {width: 100%; background: var(--apricot); color: #fff8f0; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all .2s; font-family: 'Baloo 2', cursive; margin-top: 8px;}
  .btn:hover {background: #5a00d9;}
  
  .divider {display: flex; align-items: center; margin: 24px 0; color: var(--muted); font-size: 14px;}
  .divider::before, .divider::after {content: ''; flex: 1; height: 1px; background: var(--border);}
  .divider::before {margin-right: 10px;}
  .divider::after {margin-left: 10px;}

  .error-msg {color: #ff7a7a; font-size: 14px; margin-top: 10px; display: none;}
  
  #registerForm {display: none;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">paisa<span>track</span></div>
    
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</div>
      <div class="tab" id="tabRegister" onclick="switchTab('register')">Create Account</div>
    </div>
    
    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@email.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn" onclick="login()">Log In</button>
      <div class="error-msg" id="loginError"></div>
    </div>
    
    <!-- REGISTER FORM -->
    <div id="registerForm">
      <div class="input-group">
        <label>Name</label>
        <input type="text" id="regName" placeholder="Your Name">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@email.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="••••••••">
      </div>
      <button class="btn" onclick="register()">Sign Up</button>
      <div class="error-msg" id="regError"></div>
    </div>
    
    <div class="divider">OR</div>
    
    <!-- Google Sign In -->
    <div id="g_id_onload"
         data-client_id="{{ google_client_id }}"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left"
         style="display:flex;justify-content:center;">
    </div>

  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('regError').style.display = 'none';
      
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      
      if (!email || !password) {
        errorEl.textContent = "Please fill in both fields.";
        errorEl.style.display = "block";
        return;
      }
      errorEl.style.display = "none";
      
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        errorEl.textContent = data.error || "Login failed.";
        errorEl.style.display = "block";
      }
    }

    async function register() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const errorEl = document.getElementById('regError');
      
      if (!name || !email || !password) {
        errorEl.textContent = "Please fill in all fields.";
        errorEl.style.display = "block";
        return;
      }
      errorEl.style.display = "none";
      
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        errorEl.textContent = data.error || "Registration failed.";
        errorEl.style.display = "block";
      }
    }

    async function handleGoogleLogin(response) {
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token: response.credential })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        const errorEl = document.getElementById(document.getElementById('loginForm').style.display === 'none' ? 'regError' : 'loginError');
        errorEl.textContent = "Google login failed: " + (data.error || "Unknown error");
        errorEl.style.display = "block";
      }
    }
  </script>
</body>
</html>
